services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: covey
      POSTGRES_PASSWORD: coveypass
      POSTGRES_DB: coveyweek_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covey -d coveyweek_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://covey:coveypass@postgres:5432/coveyweek_db
      OPENAI_API_KEY: ""
      JWT_SECRET_KEY: my-super-secret-key-for-production
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8000"
      USE_LLM: "true"
      QWEN_PROXY_URL: "http://se-toolkit-lab-8-qwen-code-api-1:8080/v1"
      QWEN_API_KEY: "yachta-barakuda"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
